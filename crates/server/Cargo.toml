[package]
name = "shuku"
version = "0.1.0"
edition = "2021"
description = "Self-hosted novel service compatible with Legado (Reading 3) JSON book sources"
license = "MIT"

[[bin]]
name = "shuku"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-rusqlite = "0.8"
tantivy = "0.27"
tantivy-jieba = "0.21"
pinyin = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "hickory-dns", "socks", "charset", "cookies"] }
scraper = "0.24"
regex = "1"
rquickjs = "0.14"
epub = "2.1.6"
chardetng = "0.1"
encoding_rs = "0.8"
walkdir = "2"
notify = "8"
anyhow = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
include_dir = "0.7"
url = "2"

[profile.release]
lto = false
codegen-units = 1

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
