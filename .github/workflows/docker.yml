name: Docker

# Frontend is built once and shared with both arch binary jobs; each
# binary job builds the musl static binary natively, then one
# multi-arch build-push packs both into a single image on GHCR.
# Pushes to main and version tags publish :latest / :sha-<sha>
# (plus :<version> on a v* tag); pull requests only run the build
# jobs and never push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The frontend dist is embedded into the binary at compile time,
      # so it is built once here and downloaded by both binary jobs.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: shuku-frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  binary:
    name: Build ${{ matrix.arch }} binary
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: shuku-frontend-dist
          path: frontend/dist

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Cache the cargo registry + target dir across runs (keyed per
      # arch: the two matrix jobs build different targets). First run
      # with the cache only populates it; later runs reuse it and the
      # musl builds become incremental. A cache miss or eviction
      # just falls back to a full rebuild — never a wrong build.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/server
          key: ${{ matrix.arch }}

      # 2026-11-11：apt 装 musl-tools 彻底靠不住——run #17 amd64 job 解析不到
      # azure.archive.ubuntu.com（exit 100）；run #18 里重试 3 次仍失败，
      # amd64 在这步挂了 19 分钟，arm64 卡了 21 分钟，Ubuntu 镜像 DNS
      # 持续解析不到。改用预编译交叉工具链（从 GitHub 下载，不经 apt），
      # 不再依赖 Ubuntu 镜像。
      - name: Install musl toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build musl binary
        working-directory: crates/server
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: shuku-${{ matrix.arch }}
          path: crates/server/target/${{ matrix.target }}/release/shuku
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Build and push image
    needs: binary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: shuku-amd64
          path: bin-amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: shuku-arm64
          path: bin-arm64

      # download-artifact does not reliably restore the executable bit
      # (the published image once shipped /shuku as 0644 and crun
      # refused to start it); make it explicit here and in the
      # Dockerfile COPY --chmod as well.
      - name: Make binaries executable
        run: chmod +x bin-amd64/shuku bin-arm64/shuku

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: :latest and :sha-<full sha> on every push; :<version>
      # additionally on a v* tag push.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=shuku
          cache-to: type=gha,scope=shuku,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
