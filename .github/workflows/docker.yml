name: Docker

# Build the musl static binary per architecture (amd64 + arm64, native
# runners), then pack them into one multi-arch image and push to GHCR.
# Pushes to main and version tags publish :latest / :<version>; pull
# requests only run the build + test jobs and never push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  binary:
    name: Build ${{ matrix.arch }} binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The frontend dist is embedded into the binary at compile time,
      # so it must be built before cargo build.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Gate the image on tests: a failing suite publishes nothing.
      - name: Test
        working-directory: crates/server
        run: cargo test --release

      - name: Build musl binary
        working-directory: crates/server
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: legado-server-${{ matrix.arch }}
          path: crates/server/target/${{ matrix.target }}/release/legado-server
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Build and push image
    needs: binary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: legado-server-amd64
          path: bin-amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: legado-server-arm64
          path: bin-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:amd64-${{ github.sha }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:arm64-${{ github.sha }}

      - name: Compute manifest tags
        id: tags
        run: |
          tags="ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags="$tags
          ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        run: |
          args=()
          while IFS= read -r t; do args+=(-t "$t"); done <<< "${{ steps.tags.outputs.tags }}"
          docker buildx imagetools create "${args[@]}" \
            ghcr.io/${{ github.repository }}:amd64-${{ github.sha }} \
            ghcr.io/${{ github.repository }}:arm64-${{ github.sha }}

      # GHCR packages pushed with GITHUB_TOKEN start private; flip it
      # public so the image is actually pullable. Best-effort: a
      # failure here must not fail the build.
      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH /user/packages/container/legado-server -f visibility=public
