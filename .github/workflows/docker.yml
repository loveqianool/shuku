name: Docker

# Build the musl static binary per architecture (amd64 + arm64, native
# runners), then pack them into one multi-arch image and push to GHCR.
# Pushes to main and version tags publish :latest / :<version>; pull
# requests only run the build + test jobs and never push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  binary:
    name: Build ${{ matrix.arch }} binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The frontend dist is embedded into the binary at compile time,
      # so it must be built before cargo build.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Cache the cargo registry + target dir across runs (keyed per
      # arch: the two matrix jobs build different targets). First run
      # with the cache only populates it; later runs reuse it and the
      # test + musl builds become incremental. A cache miss or eviction
      # just falls back to a full rebuild — never a wrong build.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/server
          key: ${{ matrix.arch }}

      - name: Install musl tools
        # 2026-11-11：run #17 里 amd64 job 在这步挂了——runner 偶发解析不到
        # azure.archive.ubuntu.com（Temporary failure resolving），包下不下来。
        # 加三遍重试，免得一次 DNS 抖动就杀掉整个构建。
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y musl-tools && break
            echo "apt install attempt $i failed, retrying in 15s..."
            sleep 15
          done
          command -v musl-gcc || { echo "musl-tools install failed after 3 attempts"; exit 1; }

      # Gate the image on tests: a failing suite publishes nothing.
      - name: Test
        working-directory: crates/server
        run: cargo test --release

      - name: Build musl binary
        working-directory: crates/server
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: shuku-${{ matrix.arch }}
          path: crates/server/target/${{ matrix.target }}/release/shuku
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Build and push image
    needs: binary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: shuku-amd64
          path: bin-amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: shuku-arm64
          path: bin-arm64

      # download-artifact does not reliably restore the executable bit
      # (the published image once shipped /shuku as 0644 and crun
      # refused to start it); make it explicit here and in the
      # Dockerfile COPY --chmod as well.
      - name: Make binaries executable
        run: chmod +x bin-amd64/shuku bin-arm64/shuku

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=shuku-amd64
          cache-to: type=gha,scope=shuku-amd64,mode=max
          tags: ghcr.io/${{ github.repository }}:amd64-${{ github.sha }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=shuku-arm64
          cache-to: type=gha,scope=shuku-arm64,mode=max
          tags: ghcr.io/${{ github.repository }}:arm64-${{ github.sha }}

      - name: Compute manifest tags
        id: tags
        run: |
          tags="ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags="$tags
          ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        run: |
          args=()
          while IFS= read -r t; do args+=(-t "$t"); done <<< "${{ steps.tags.outputs.tags }}"
          docker buildx imagetools create "${args[@]}" \
            ghcr.io/${{ github.repository }}:amd64-${{ github.sha }} \
            ghcr.io/${{ github.repository }}:arm64-${{ github.sha }}
